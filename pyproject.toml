[project]
name = "deep-learning-from-scratch-3"
version = "0.1.0"
description = "Local uv environment for Deep Learning from Scratch 3"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cuda-toolkit[cublas,cudart,cufft,curand,cusolver,cusparse,nvrtc]>=12.9,<13",
    "cupy-cuda12x>=13.6,<14",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<2.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "chainer>=7.8.1",
    "setuptools<60",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
chainer = ["setuptools<81"]
